[workspace]
authors = ["Dave Barry <davejpbarry@gmail.com>"]
channels = ["conda-forge"]
name = "stardist"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "<3.11"

[pypi-dependencies]
tensorflow = ">=2.11.0, <3"
stardist = ">=0.9.2, <0.10"
jupyterlab = ">=3.6.8, <4"
scikit-image = ">=0.19.3, <0.20"
matplotlib = ">=3.5.3, <4"
pandas = ">=1.3.5, <2"
numpy = ">=1.21.6, <2"
imagecodecs = ">=2021.11.20, <2022"
openpyxl = ">=3.1.3, <4"
seaborn = ">=0.12.2, <0.13"

[environments]
stardist = ["default"]