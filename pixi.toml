[workspace]
authors = ["Dave Barry <davejpbarry@gmail.com>"]
channels = ["conda-forge"]
name = "stardist"
platforms = ["win-64", "osx-arm64", "osx-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"

[environments]
stardist = ["default"]

[pypi-dependencies]
tensorflow = ">=2.13, <2.16"
stardist = ">=0.9.2, <0.10"
jupyterlab = ">=4.6.5, <5"
scikit-image = ">=0.26.0, <0.27"
matplotlib = ">=3.11.2, <4"
pandas = ">=3.0.6, <4"
numpy = ">=1.26.4, <2"
imagecodecs = ">=2026.1.14, <2027"
openpyxl = ">=3.1.5, <4"
seaborn = ">=0.13.2, <0.14"
